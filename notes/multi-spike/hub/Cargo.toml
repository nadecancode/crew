# Spike for notes/web-multi.md: one loopback server for every running crew
# session of this user. A WebSocket names its workspace in `hello` and is then
# one connection to that workspace's daemon. Not part of the workspace.
[package]
name = "hub"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
crew-core = { path = "../../../crates/crew-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs"] }
tokio-tungstenite = { version = "=0.28.0", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
httparse = "1"
serde_json = "1"

[workspace]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
