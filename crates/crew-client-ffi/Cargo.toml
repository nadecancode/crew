[package]
name = "crew-client-ffi"
description = "Typed native bindings for the shared Crew client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.93"
publish = false

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "crew-client-bindgen"
path = "src/bin/crew-client-bindgen.rs"
required-features = ["bindgen"]

[features]
default = []
bindings = ["dep:uniffi", "dep:crew-client-transport", "crew-client-transport/gateway", "dep:tokio"]
bindgen = ["bindings", "uniffi/cli", "uniffi/cargo-metadata"]
local = ["bindings", "crew-client-transport/local"]
# Live facade tests against an isolated real daemon and native gateway.
gateway-tests = ["local", "crew/native-gateway"]

[dependencies]
crew-client = { path = "../crew-client" }
crew-protocol = { path = "../crew-protocol" }
crew-client-transport = { path = "../crew-client-transport", optional = true }
serde_json.workspace = true
tokio = { workspace = true, optional = true }
uniffi = { version = "=0.31.0", default-features = false, optional = true }

[dev-dependencies]
tempfile.workspace = true
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"] }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls-pemfile = "=2.2.0"
sha2.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
crew = { path = "../crew", default-features = false }
crew-core = { path = "../crew-core" }
