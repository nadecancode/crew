[package]
name = "crew-client-transport"
description = "Scoped native Crew session driver and bounded transport adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.93"

[features]
default = []
runtime = ["dep:tokio"]
local = ["runtime", "dep:crew-core", "dep:libc"]
gateway = ["runtime", "dep:rustls", "dep:tokio-rustls", "dep:rustls-pemfile", "dep:ed25519-dalek", "dep:tokio-tungstenite", "dep:futures-util", "dep:sha2", "dep:zeroize"]
real-core-tests = []
gateway-tests = ["gateway", "local", "crew/native-gateway", "rustls/tls12"]

[dependencies]
crew-client = { path = "../crew-client" }
crew-protocol = { path = "../crew-protocol" }
serde_json.workspace = true
serde.workspace = true
base64.workspace = true
tokio = { workspace = true, optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"], optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = { version = "=2.2.0", optional = true }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
zeroize = { version = "=1.8.2", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
crew-core = { path = "../crew-core", optional = true }
libc = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
crew = { path = "../crew", default-features = false }
