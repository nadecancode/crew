[package]
name = "crew-desktop"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version = "1.93"
publish = false

[[bin]]
name = "crew-desktop"
path = "src/main.rs"
required-features = ["native-ui"]

[features]
default = []
native-ui = ["dep:gtk"]
# Reserved for the approved local adapter, which is integrated in a later card.
local = []

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "=0.10.3", features = ["v4_6"], optional = true }
