[package]
name = "crew-desktop"
version.workspace = true
edition = "2021"
license.workspace = true
rust-version = "1.93"
publish = false

[[bin]]
name = "crew-desktop"
path = "src/main.rs"
required-features = ["native-ui"]

[features]
default = []
native-ui = ["dep:gtk", "dep:vte4", "dep:crew-client", "dep:crew-protocol"]
local = ["dep:crew-client-transport", "crew-client-transport/local", "dep:tokio"]

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "=0.10.3", features = ["v4_6"], optional = true }
vte4 = { version = "=0.9.0", optional = true }
crew-client = { path = "../crew-client", optional = true }
crew-protocol = { path = "../crew-protocol", optional = true }
crew-client-transport = { path = "../crew-client-transport", optional = true }
tokio = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
crew-core = { path = "../crew-core" }
crew = { path = "../crew", default-features = false }
