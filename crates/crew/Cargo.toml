[package]
name = "crew"
description = "Local-first multi-agent orchestration for Claude Code and Codex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "crew"
path = "src/lib.rs"

[[bin]]
name = "crew"
path = "src/main.rs"

[features]
default = []
native-gateway = ["dep:crew-protocol", "dep:tokio-rustls", "dep:ed25519-dalek", "dep:zeroize"]

[dependencies]
crew-core = { path = "../crew-core" }
crew-tui = { path = "../crew-tui" }
crew-protocol = { path = "../crew-protocol", optional = true }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"], optional = true }
rustls-pemfile = "=2.2.0"
# Mozilla roots for toolbox MCP servers over https (no system store needed).
webpki-roots = "=1.0.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast", "zeroize"], optional = true }
zeroize = { version = "=1.8.2", optional = true }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
toml.workspace = true
libc.workspace = true
tokio.workspace = true
rusqlite.workspace = true
clap.workspace = true
portable-pty.workspace = true
vt100.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
base64.workspace = true
uuid.workspace = true
ratatui.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
httparse.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
