{
  "project": "toolbox-fixtures",
  "objective": "Offline toolbox acceptance; use only fixture runtimes.",
  "workspace": {
    "path": "@ROOT@/project",
    "isolation": "shared"
  },
  "backend": "pty",
  "toolboxes": {
    "base": {
      "mcp": {
        "context7": {
          "command": [
            "@PYTHON@",
            "@ROOT@/mcp_stub.py"
          ],
          "cwd": ".",
          "env": {
            "FIXTURE_PUBLIC": {
              "value": "public-fixture-value"
            }
          }
        }
      }
    },
    "web": {
      "include": [
        "base"
      ],
      "mcp": {
        "playwright": {
          "command": [
            "@PYTHON@",
            "@ROOT@/mcp_stub.py"
          ],
          "required": true,
          "runtimes": [
            "claude",
            "codex",
            "pi"
          ]
        }
      },
      "skills": {
        "frontend-qa": {
          "path": "../items/skills/frontend-qa",
          "required": true
        }
      },
      "plugins": {
        "web-kit": {
          "path": "../items/plugins/lint-kit",
          "runtimes": [
            "claude"
          ]
        }
      },
      "subagents": {
        "reviewer": {
          "path": "../items/subagents/reviewer.md",
          "runtimes": [
            "claude",
            "codex"
          ]
        }
      },
      "hooks": {
        "claude-stop": {
          "event": "Stop",
          "matcher": "Bash",
          "command": [
            "@ROOT@/bin/hook",
            "claude"
          ],
          "required": false,
          "runtimes": [
            "claude"
          ]
        },
        "codex-stop": {
          "event": "Stop",
          "matcher": "Bash",
          "command": [
            "@ROOT@/bin/hook",
            "codex"
          ],
          "required": false,
          "runtimes": [
            "codex"
          ]
        },
        "pi-stop": {
          "event": "Stop",
          "matcher": "Bash",
          "command": [
            "@ROOT@/bin/hook",
            "pi"
          ],
          "required": false,
          "runtimes": [
            "pi"
          ]
        }
      }
    },
    "github": {
      "mcp": {
        "github": {
          "command": [
            "@PYTHON@",
            "@ROOT@/mcp_stub.py"
          ],
          "env": {
            "GITHUB_TOKEN": {
              "env": "SHOP_GITHUB_TOKEN"
            },
            "ALIAS_TOKEN": {
              "env": "SHOP_TOKEN"
            },
            "GITHUB_TOOLSETS": {
              "value": "repos,issues"
            }
          },
          "required": false
        },
        "docs": {
          "url": "@HTTP_URL@",
          "transport": "http",
          "headers": {
            "Authorization": {
              "env": "DOCS_TOKEN",
              "format": "Bearer {}"
            },
            "X-Fixture": {
              "value": "public-header"
            }
          }
        }
      }
    },
    "sse-field": {
      "mcp": {
        "legacy-sse": {
          "url": "http://127.0.0.1:9/sse",
          "transport": "sse"
        }
      }
    }
  },
  "defaults": {
    "runtime": "claude",
    "auto_trust": false,
    "toolbox": {
      "include": [
        "base"
      ],
      "skills": {
        "shared": {
          "path": "../items/skills/shared"
        }
      },
      "inherit": {
        "operator": "none",
        "project": [
          "skills",
          "plugins",
          "subagents",
          "hooks",
          "settings",
          "memory"
        ]
      }
    }
  },
  "orchestrator": {
    "toolbox": {
      "reset": true,
      "inherit": {
        "operator": "none",
        "project": "none"
      }
    }
  },
  "agents": [
    {
      "id": "qa",
      "role": "frontend QA",
      "toolbox": {
        "include": [
          "web"
        ]
      }
    },
    {
      "id": "release",
      "role": "release notes",
      "runtime": "codex",
      "toolbox": {
        "include": [
          "github"
        ],
        "exclude": [
          "mcp.context7"
        ],
        "skills": {
          "changelog": {
            "path": "../items/skills/changelog"
          }
        },
        "plugins": {
          "lint-kit": {
            "path": "../items/plugins/lint-kit"
          }
        }
      }
    },
    {
      "id": "qa-peer",
      "role": "frontend QA",
      "toolbox": {
        "include": [
          "web"
        ]
      }
    },
    {
      "id": "pi-member",
      "runtime": "pi",
      "toolbox": {
        "include": [
          "web"
        ]
      }
    },
    {
      "id": "reset",
      "runtime": "claude",
      "toolbox": {
        "reset": true,
        "strict": true,
        "inherit": {
          "operator": "none",
          "project": "none"
        },
        "skills": {
          "only": {
            "path": "../items/skills/changelog",
            "required": true,
            "runtimes": [
              "claude"
            ]
          }
        }
      }
    },
    {
      "id": "shell-member",
      "runtime": "shell",
      "command": [
        "@ROOT@/bin/hook",
        "shell"
      ],
      "toolbox": {
        "include": [
          "web",
          "github"
        ],
        "strict": true
      }
    },
    {
      "id": "inherit-mcp",
      "toolbox": {
        "inherit": {
          "operator": [
            "mcp"
          ],
          "project": "none"
        },
        "exclude": [
          "skills.*"
        ]
      }
    },
    {
      "id": "inherit-all",
      "toolbox": {
        "inherit": {
          "operator": "all",
          "project": "all"
        }
      }
    }
  ]
}
